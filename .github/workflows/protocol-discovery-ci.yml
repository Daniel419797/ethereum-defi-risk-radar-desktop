name: Protocol Discovery CI

on:
  pull_request:
    paths:
      - "ethereum-defi-risk-radar-desktop-v0.7.0/**"
      - ".github/workflows/protocol-discovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethereum-defi-risk-radar-desktop-v0.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ethereum-defi-risk-radar-desktop-v0.7.0/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Protocol discovery and smoke gates
        run: npm run check

      - name: Analysis regression
        run: npm run test:analysis

      - name: Proof regression
        run: npm run test:proof

      - name: Desktop analysis regression
        run: npm run test:desktop-analysis
