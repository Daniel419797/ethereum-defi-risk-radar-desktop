name: Build and Publish Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: ethereum-defi-risk-radar-desktop-v0.7.0

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"

      - name: Validate package and tag versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./${APP_DIR}/package.json').version")"
          LOCK_VERSION="$(node -p "require('./${APP_DIR}/package-lock.json').version")"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to read package version" >&2
            exit 1
          fi
          if [[ "$LOCK_VERSION" != "$VERSION" ]]; then
            echo "package.json version ($VERSION) does not match package-lock.json ($LOCK_VERSION)" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must match package version v${VERSION}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require tagged releases to come from main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tag must point to a commit reachable from main." >&2
            exit 1
          fi

  build-macos:
    name: Build signed/notarized macOS universal package
    needs: validate-release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ethereum-defi-risk-radar-desktop-v0.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: ethereum-defi-risk-radar-desktop-v0.7.0/package-lock.json

      - name: Require Apple distribution secrets
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full repository checks
        run: npm run check

      - name: Run deeper analysis regression gates
        run: |
          npm run test:analysis
          npm run test:proof
          npm run test:desktop-analysis

      - name: Build, sign and notarize universal DMG + ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify signature, Gatekeeper, notarization and universal architecture
        run: npm run verify:mac

      - name: Generate macOS checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ethereum-defi-risk-radar-macos
          path: |
            ethereum-defi-risk-radar-desktop-v0.7.0/release/Ethereum-DeFi-Risk-Radar-*.dmg
            ethereum-defi-risk-radar-desktop-v0.7.0/release/Ethereum-DeFi-Risk-Radar-*.zip
            ethereum-defi-risk-radar-desktop-v0.7.0/release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows installer
    needs: validate-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ethereum-defi-risk-radar-desktop-v0.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: ethereum-defi-risk-radar-desktop-v0.7.0/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Run full repository checks
        shell: pwsh
        run: npm run check

      - name: Run deeper analysis regression gates
        shell: pwsh
        run: |
          npm run test:analysis
          npm run test:proof
          npm run test:desktop-analysis

      - name: Build NSIS installer
        shell: pwsh
        run: npm run dist:win

      - name: Verify installer provisions risk-radar CLI
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem .\release\Ethereum-DeFi-Risk-Radar-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed with exit code $($process.ExitCode)" }
          $cli = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\risk-radar.cmd"
          if (-not (Test-Path $cli)) { throw "risk-radar.cmd was not installed" }
          $version = (& $cli version | Out-String).Trim()
          if ($version -ne $env:EXPECTED_VERSION) { throw "Unexpected CLI version: $version" }

      - name: Generate Windows checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem .\release\Ethereum-DeFi-Risk-Radar-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii .\release\SHA256SUMS-windows.txt
          Get-Content .\release\SHA256SUMS-windows.txt

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ethereum-defi-risk-radar-windows
          path: |
            ethereum-defi-risk-radar-desktop-v0.7.0/release/Ethereum-DeFi-Risk-Radar-Setup-*.exe
            ethereum-defi-risk-radar-desktop-v0.7.0/release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - validate-release
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ethereum-defi-risk-radar-*
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          assets=(
            Ethereum-DeFi-Risk-Radar-*.dmg
            Ethereum-DeFi-Risk-Radar-*.zip
            Ethereum-DeFi-Risk-Radar-Setup-*.exe
            SHA256SUMS.txt
            SHA256SUMS-macos.txt
            SHA256SUMS-windows.txt
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "Ethereum DeFi Risk Radar v${VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          listing="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Eq '^Ethereum-DeFi-Risk-Radar-.*\.dmg$' <<<"$listing"
          grep -Eq '^Ethereum-DeFi-Risk-Radar-.*\.zip$' <<<"$listing"
          grep -Eq '^Ethereum-DeFi-Risk-Radar-Setup-.*\.exe$' <<<"$listing"
          grep -Fxq 'SHA256SUMS.txt' <<<"$listing"
