name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build and smoke checks
        shell: pwsh
        run: npm run check

      - name: Build NSIS installer
        shell: pwsh
        run: npm run dist:win

      - name: Verify installer provisions risk-radar CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem .\release\Ethereum-DeFi-Risk-Radar-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed with exit code $($process.ExitCode)" }
          $cli = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\risk-radar.cmd"
          if (-not (Test-Path $cli)) { throw "risk-radar.cmd was not installed" }
          $version = (& $cli version | Out-String).Trim()
          if ($version -ne "0.7.0") { throw "Unexpected CLI version: $version" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethereum-defi-risk-radar-windows
          path: release/Ethereum-DeFi-Risk-Radar-Setup-*.exe
          if-no-files-found: error
